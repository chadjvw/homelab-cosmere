apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-secrets
  namespace: monitoring
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ntfy-secrets
    template:
      engineVersion: v2
      data:
        # declarative ntfy user provisioning (auth-users format: user:bcrypt-hash:role)
        authUsers: "alertmanager:{{ .alertmanagerHash }}:user,chad:{{ .chadHash }}:user"
        # full config file for the ntfy-alertmanager bridge (davyjones); password here
        # is the plaintext counterpart of alertmanagerHash, used for HTTP basic auth
        config.toml: |
          [topic]
          default = "alerts"
          label = "topic"

          [ntfy]
          url = "http://ntfy.monitoring.svc.cluster.local:8080"
          username = "alertmanager"
          password = "{{ .alertmanagerPassword }}"

          # davyjones' built-in default title template does
          # `commonLabels | get(key='alertname')` with no default, which errors
          # (and 500s the whole webhook) when a notification groups alerts with
          # different alertnames -- we route/group by namespace only, so that's
          # the common case, not the exception. Same template as upstream's
          # default, just with a fallback added. Wrapped in a Go raw string so
          # ESO's own {{ }} templating (engineVersion v2) leaves davyjones'
          # Tera {{ }} syntax alone instead of trying to render it.
          [templates]
          title = "{{ `{% if status == 'resolved' %}[Resolved] {% endif %}{{ commonLabels | get(key='severity', default='unknown') | upper}}: {{ commonLabels | get(key='alertname', default='multiple alerts') }}` }}"
  data:
    - secretKey: alertmanagerHash
      remoteRef:
        key: NTFY_ALERTMANAGER_PASSWORD_HASH
    - secretKey: chadHash
      remoteRef:
        key: NTFY_CHAD_PASSWORD_HASH
    - secretKey: alertmanagerPassword
      remoteRef:
        key: NTFY_ALERTMANAGER_PASSWORD
