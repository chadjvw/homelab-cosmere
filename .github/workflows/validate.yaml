name: Validate
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'observability/**'
      - 'gitops/**'
      - 'repos/**'
      - 'flux/**'
      - 'bootstrap/**'
      - 'mise.toml'
      - '.mise/**'
      - '.github/workflows/validate.yaml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Validate
        run: mise run validate
