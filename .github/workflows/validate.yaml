name: Validate
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'observability/**'
      - 'gitops/**'
      - 'repos/**'
      - 'flux/**'
      - 'bootstrap/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Validate
        run: mise run validate
