machine:
  certSANs:
    - 10.0.10.12
    - 10.0.10.13
    - 10.0.10.14
    - 127.0.0.1 # Kubeprism
---
# Cilium is the CNI (infra/cilium); without this Talos deploys flannel.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Generated with the control-plane NoSchedule taint and exclude-from-external-load-balancers
# label, ignoring allowSchedulingOnControlPlanes. Labels stay on machine.nodeLabels.
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
# ponytail: workload isolation (sandboxd) is a Talos 1.14 default that upgraded clusters don't get.
# Kept off cluster-wide while it's trialled per node (patches/node/<host>/20-workload-isolation.yaml);
# the risk is the in-tree NFS volumes. Drop this once every node runs it.
apiVersion: v1alpha1
kind: SecurityProfileConfig
$patch: delete
