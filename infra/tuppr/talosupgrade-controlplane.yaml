apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos-controlplane
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.10
  policy:
    # kexec was assumed reliable on this real hardware (see
    # talosupgrade-workers.yaml for the known QEMU no-op case), but the
    # Aug 4 -> v1.13.6 and Aug 11 -> v1.13.8 cycles both reported Completed
    # while the nodes never actually rebooted into the new version. Forcing
    # a real reboot until tuppr's health checks can verify version drift.
    rebootMode: powercycle
  maintenance:
    windows:
      - start: "0 2 * * 2" # 2am every Tuesday
        duration: 4h
  healthChecks:
    - description: All nodes are Ready
      apiVersion: v1
      kind: Node
      expr: "object.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
    - description: No pods are in a failed state
      apiVersion: v1
      kind: Pod
      expr: "object.status.phase != 'Failed'"
