apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-nvmeof
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: storage
  releaseName: democratic-csi-nvmeof
  install:
    createNamespace: true
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
      interval: 12h
  values:
    csiDriver:
      name: org.democratic-csi.nvmeof
    storageClasses:
      - name: org.democratic-csi.nvmeof
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: xfs
          detachedVolumesFromSnapshots: "true"
    volumeSnapshotClasses:
      - name: org.democratic-csi.nvmeof
        parameters:
          detachedSnapshots: "false"
    driver:
      existingConfigSecret: truenas-nvmeof-driver-config
      config:
        driver: freenas-api-nvmeof
    node:
      hostPID: true
      driver:
        # nvmeDirMountEnabled: false
        # nvmeDirHostPath: /etc/nvme
        # nvmeDirHostPathType: Directory
        enabled: true
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          pullPolicy: Always
          tag: v1.9.5
    controller:
      externalAttacher:
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 128Mi
      externalProvisioner:
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 128Mi
      externalResizer:
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 128Mi
      externalSnapshotter:
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 128Mi
      driver:
        logLevel: info
        enabled: true
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          pullPolicy: Always
          tag: v1.9.5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
    csiProxy:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
