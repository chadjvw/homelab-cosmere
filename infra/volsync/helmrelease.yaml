apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: volsync-system
  releaseName: volsync
  install:
    createNamespace: true
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      # renovate: registryUrl=https://backube.github.io/helm-charts
      chart: volsync
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: volsync
        namespace: flux-system
      interval: 12h
