apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  # Adopts the release originally installed by hand with `helm install` (same name/namespace).
  # The operator pins which Flux versions FluxInstance "2.x" can resolve to, so it must stay current.
  targetNamespace: flux-system
  releaseName: flux-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: flux-operator
      version: 0.45.0
      sourceRef:
        kind: HelmRepository
        name: controlplaneio-fluxcd
        namespace: flux-system
      interval: 12h
