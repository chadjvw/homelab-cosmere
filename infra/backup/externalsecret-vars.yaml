apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3-vars
  namespace: flux-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: backup-s3-vars
  data:
    - secretKey: BACKUP_S3_ENDPOINT
      remoteRef:
        key: BACKUP_S3_ENDPOINT
    - secretKey: BACKUP_S3_BUCKET
      remoteRef:
        key: BACKUP_S3_BUCKET
