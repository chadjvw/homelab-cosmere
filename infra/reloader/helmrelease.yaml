apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kube-system
  releaseName: reloader
  chart:
    spec:
      # renovate: registryUrl=https://stakater.github.io/stakater-charts
      chart: reloader
      version: 2.2.16
      sourceRef:
        kind: HelmRepository
        name: reloader
        namespace: flux-system
      interval: 12h
