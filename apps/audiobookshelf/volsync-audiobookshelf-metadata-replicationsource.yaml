apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: audiobookshelf-metadata
  namespace: default
spec:
  sourcePVC: audiobookshelf-metadata-nvmeof
  trigger:
    schedule: "0 4 * * *"
  restic:
    repository: audiobookshelf-metadata-volsync-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: org.democratic-csi.nvmeof
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    cacheCapacity: 1Gi
    cacheStorageClassName: org.democratic-csi.nvmeof
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
