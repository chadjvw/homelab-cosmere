apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfbridge
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: shelfbridge
  data:
    - secretKey: SHELFBRIDGE_USER_0_ABS_TOKEN
      remoteRef:
        key: SHELFBRIDGE_ABS_TOKEN
    - secretKey: SHELFBRIDGE_USER_0_HARDCOVER_TOKEN
      remoteRef:
        key: SHELFBRIDGE_HARDCOVER_TOKEN
