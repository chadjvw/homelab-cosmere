apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ytdl-sub-oidc
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ytdl-sub
  oidc:
    provider:
      issuer: https://auth.vanwyhe.xyz/oauth2/openid/ytdl-sub-gateway
      authorizationEndpoint: https://auth.vanwyhe.xyz/ui/oauth2
      tokenEndpoint: https://auth.vanwyhe.xyz/oauth2/token
    clientID: ytdl-sub-gateway
    clientSecret:
      name: ytdl-sub-oidc
    redirectURL: https://ytdl-sub.int.vanwyhe.xyz/oauth2/callback
    scopes:
      - profile
      - email
      - groups
