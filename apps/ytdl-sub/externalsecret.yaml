apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ytdl-sub-oidc
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ytdl-sub-oidc
  data:
    - secretKey: client-secret
      remoteRef:
        key: YTDL_SUB_OIDC_CLIENT_SECRET
