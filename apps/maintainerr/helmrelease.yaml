apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: default
  releaseName: maintainerr
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 12h
  values:
    controllers:
      main:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            env:
              TZ: America/Denver
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: "3.33.0"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              privileged: false
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
    persistence:
      data:
        existingClaim: maintainerr-data-nvmeof
        globalMounts:
          - path: /opt/data
    service:
      main:
        controller: main
        ports:
          http:
            port: 6246
    route:
      main:
        hostnames:
          - maintainerr.int.vanwyhe.xyz
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: internal
            namespace: kube-system
            sectionName: https
