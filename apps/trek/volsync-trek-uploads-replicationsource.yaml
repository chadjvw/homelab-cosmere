apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: trek-uploads
  namespace: default
spec:
  sourcePVC: trek-uploads-nvmeof
  trigger:
    schedule: "20 5 * * *"
  restic:
    repository: trek-uploads-volsync-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: org.democratic-csi.nvmeof
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    cacheCapacity: 1Gi
    cacheStorageClassName: org.democratic-csi.nvmeof
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 1000
