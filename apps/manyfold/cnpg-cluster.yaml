apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: manyfold-database
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 5Gi
    storageClass: org.democratic-csi.nvmeof
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://${BACKUP_S3_BUCKET}/manyfold-database"
      endpointURL: "${BACKUP_S3_ENDPOINT}"
      s3Credentials:
        accessKeyId:
          name: backup-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-s3-credentials
          key: SECRET_ACCESS_KEY
        region:
          name: backup-s3-credentials
          key: REGION
      wal:
        compression: zstd
      data:
        compression: snappy
