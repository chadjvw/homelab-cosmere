apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: kometa
    template:
      data:
        config.yml: |
          tmdb:
            apikey: {{ .TMDB_API_KEY }}
          media_servers:
            jellyfin:
              type: jellyfin
              url: http://jellyfin:8096
              token: {{ .JELLYFIN_API_KEY }}
          libraries:
            Movies:
              server: jellyfin
              collection_files:
                - default: basic
                - default: imdb
                - default: tmdb
            Shows:
              server: jellyfin
              collection_files:
                - default: basic
                - default: imdb
                - default: tmdb
  data:
    - secretKey: TMDB_API_KEY
      remoteRef:
        key: TMDB_API_KEY
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: JELLYFIN_API_KEY
