apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kometa
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: default
  releaseName: kometa
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 12h
  values:
    controllers:
      main:
        type: cronjob
        annotations:
          reloader.stakater.com/auto: "true"
        cronjob:
          schedule: "0 5 * * *"
          concurrencyPolicy: Forbid
        initContainers:
          # kometa rewrites config.yml at startup, so it can't read the secret mount directly
          copy-config:
            image:
              repository: docker.io/alpine
              tag: "3.24.4"
            command: ["cp", "/secret/config.yml", "/config/config.yml"]
        containers:
          main:
            image:
              # Jellyfin support only exists on the develop branch (not in v2.5.5)
              repository: docker.io/kometateam/kometa
              tag: develop@sha256:07bcc389e497c5708c45a23ac601117cc9ab846b1f550925abc8195b92f9f9b1
            args:
              - --run
            env:
              TZ: America/Denver
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /config
      config-file:
        type: secret
        name: kometa
        globalMounts:
          - path: /secret
            readOnly: true
