apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: node-red-data
  namespace: default
spec:
  sourcePVC: node-red-data-nvmeof
  trigger:
    schedule: "35 4 * * *"
  restic:
    repository: node-red-data-volsync-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: org.democratic-csi.nvmeof
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    cacheCapacity: 1Gi
    cacheStorageClassName: org.democratic-csi.nvmeof
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
