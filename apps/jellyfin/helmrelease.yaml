apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: default
  releaseName: jellyfin
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 12h
  values:
    controllers:
      main:
        pod:
          nodeSelector:
            intel-igpu: intel-graphics-24eu # scadrial, N150 (Alder Lake-N) iGPU (where plex ran)
          enableServiceLinks: false # JELLYFIN_* service env vars would leak into jellyfin's config
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            supplementalGroups:
              - 100
        containers:
          main:
            env:
              TZ: America/Denver
              # keep the linuxserver-era layout; image defaults point at stale 2025 copies on the PVC
              HOME: /config
              JELLYFIN_DATA_DIR: /config/data
              JELLYFIN_CONFIG_DIR: /config
              JELLYFIN_CACHE_DIR: /config/cache
              JELLYFIN_LOG_DIR: /config/log
              XDG_CACHE_HOME: /config/cache
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: "12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  failureThreshold: 6
            resources:
              limits:
                gpu.intel.com/i915: 1
    persistence:
      config:
        existingClaim: jellyfin-data-nvmeof
      cache:
        enabled: true
        existingClaim: jellyfin-cache-nvmeof
        globalMounts:
          - path: /config/cache
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/log
      tv:
        enabled: true
        type: nfs
        server: truenas.vanwyhe.xyz
        path: /mnt/mongo/data/media/tv
        globalMounts:
          - path: /media/tv
      movies:
        enabled: true
        type: nfs
        server: truenas.vanwyhe.xyz
        path: /mnt/mongo/data/media/movies
        globalMounts:
          - path: /media/movies
      music:
        enabled: true
        type: nfs
        server: truenas.vanwyhe.xyz
        path: /mnt/mongo/data/media/music
        globalMounts:
          - path: /media/music
      transcode:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /transcode
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      main:
        controller: main
        type: LoadBalancer
        externalTrafficPolicy: Local
        ports:
          http:
            port: 8096
    route:
      main:
        hostnames:
          - jellyfin.vanwyhe.xyz
          - jellyfin.vw4.lol
          - jf.vw4.lol
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: external
            namespace: kube-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /metrics
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: gateway.envoyproxy.io
                  kind: HTTPRouteFilter
                  name: jellyfin-deny-metrics
          - backendRefs:
              - group: ""
                kind: Service
                name: jellyfin
                namespace: default
                port: 8096
                weight: 1
            timeouts:
              request: 2h
