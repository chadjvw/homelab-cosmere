apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-logging-config
  namespace: default
data:
  logging.json: |
    {
        "Serilog": {
            "MinimumLevel": {
                "Default": "Information",
                "Override": {
                    "Microsoft": "Warning",
                    "System": "Warning"
                }
            },
            "WriteTo": [
                {
                    "Name": "Console",
                    "Args": {
                        "outputTemplate": "[{Timestamp:HH:mm:ss.fff}] [{Level:u3}] [{ThreadId}] {SourceContext}: {Message:lj}{NewLine}{Exception}"
                    }
                }
            ],
            "Enrich": [ "FromLogContext", "WithThreadId" ]
        }
    }
