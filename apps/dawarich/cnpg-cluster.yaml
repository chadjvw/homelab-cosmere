apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-database
  namespace: default
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgis
  imageName: ghcr.io/cloudnative-pg/postgis:15-3.3-1
  storage:
    size: 10Gi
    storageClass: org.democratic-csi.nvmeof
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://${BACKUP_S3_BUCKET}/dawarich-database"
      endpointURL: "${BACKUP_S3_ENDPOINT}"
      s3Credentials:
        accessKeyId:
          name: backup-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-s3-credentials
          key: SECRET_ACCESS_KEY
        region:
          name: backup-s3-credentials
          key: REGION
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis CASCADE;
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
