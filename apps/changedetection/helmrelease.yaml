apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: default
  releaseName: changedetection
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 12h
  values:
    controllers:
      main:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            # renovate: datasource=docker depName=ghcr.io/dgtlmoon/changedetection.io
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: "0.70.3"
            env:
              TZ: America/Denver
              BASE_URL: https://changedetection.int.vanwyhe.xyz
              PLAYWRIGHT_DRIVER_URL: ws://localhost:3000
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
          chrome:
            # renovate: datasource=docker depName=docker.io/dgtlmoon/sockpuppetbrowser
            image:
              repository: docker.io/dgtlmoon/sockpuppetbrowser
              tag: "0.0.4"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
    persistence:
      data:
        existingClaim: changedetection-data-nvmeof
        advancedMounts:
          main:
            main:
              - path: /datastore
      # chrome scratch only; ephemeral, so never backed up
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          main:
            chrome:
              - path: /dev/shm
    service:
      main:
        controller: main
        ports:
          http:
            port: 5000
    route:
      main:
        hostnames:
          - changedetection.int.vanwyhe.xyz
          - changedetection.i.vw4.lol
          - changedetection.int.vw4.lol
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: internal
            namespace: kube-system
            sectionName: https
