apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: cleanuparr-config
  namespace: default
spec:
  sourcePVC: cleanuparr-config-nvmeof
  trigger:
    schedule: "50 5 * * *"
  restic:
    repository: cleanuparr-config-volsync-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: org.democratic-csi.nvmeof
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    cacheCapacity: 1Gi
    cacheStorageClassName: org.democratic-csi.nvmeof
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
