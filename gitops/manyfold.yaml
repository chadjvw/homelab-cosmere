apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manyfold
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps/manyfold
  prune: true
  sourceRef:
    kind: OCIRepository
    name: default
  dependsOn:
    - name: repos
    - name: external-secrets
    - name: democratic-csi-nvmeof
    - name: cloudnative-pg
    - name: backup
  postBuild:
    substituteFrom:
      - kind: Secret
        name: backup-s3-vars
